<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MinistryOS 3.5</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <style>
        body { background-color: #0f172a; color: white; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .safe-pb { padding-bottom: env(safe-area-inset-bottom); }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
        .cal-day { min-height: 45px; border-radius: 6px; font-size: 11px; padding: 4px; display: flex; flex-direction: column; align-items: center; }
        .current-day { border: 1px solid #3b82f6; background: rgba(59, 130, 246, 0.1); }
        .dot { width: 6px; height: 6px; border-radius: 50%; margin-bottom: 2px; }
        input, textarea, select { background: #1e293b; border: 1px solid #334155; color: white; border-radius: 8px; padding: 12px; width: 100%; outline: none; font-size: 16px; transition: border 0.2s; }
        input:focus, textarea:focus, select:focus { border-color: #3b82f6; }
        label { font-size: 11px; text-transform: uppercase; color: #94a3b8; font-weight: bold; margin-bottom: 4px; display: block; }
        .tab-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #64748b; transition: all 0.2s; min-width: 42px; }
        .tab-active { color: #3b82f6; transform: scale(1.08); }
        .card-action { padding: 8px; border-radius: 6px; color: #64748b; }
        .card-action:hover { background: #334155; color: white; }
        .line-clamp-1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>
    <div id="root" class="h-screen w-screen bg-slate-900"></div>

    <script type="text/babel">
        const firebaseConfig = {
          apiKey: "AIzaSyCWTjZ5P-cvfL3bgFOrl53qRQEfWP35ThE",
          authDomain: "crossyth-dashboard.firebaseapp.com",
          projectId: "crossyth-dashboard",
          storageBucket: "crossyth-dashboard.firebasestorage.app",
          messagingSenderId: "999386499044",
          appId: "1:999386499044:web:49e4bc10c133b4c20f29f1"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        const N8N = {
            cameraReceiptIntake: 'https://snl513.app.n8n.cloud/webhook/ministryos-camera-receipt-intake-v1',
            adminReceiptQueue: 'https://snl513.app.n8n.cloud/webhook/ministryos-admin-receipt-queue-v1'
        };

        const Icon = ({name, size=20, className=''}) => {
            const common = { xmlns: 'http://www.w3.org/2000/svg', width: size, height: size, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round', className };
            const icons = {
                Calendar: <svg {...common}><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
                Briefcase: <svg {...common}><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>,
                MapPin: <svg {...common}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>,
                Mic2: <svg {...common}><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>,
                Users: <svg {...common}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
                BookOpen: <svg {...common}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
                Shield: <svg {...common}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
                Camera: <svg {...common}><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>,
                List: <svg {...common}><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>,
                ArrowLeft: <svg {...common}><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>,
                ChevronLeft: <svg {...common}><polyline points="15 18 9 12 15 6"/></svg>,
                ChevronRight: <svg {...common}><polyline points="9 18 15 12 9 6"/></svg>,
                ChevronDown: <svg {...common}><polyline points="6 9 12 15 18 9"/></svg>,
                PlusCircle: <svg {...common}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>,
                Save: <svg {...common}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>,
                Sparkles: <svg {...common}><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3Z"/></svg>,
                Trash: <svg {...common}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>,
                Edit: <svg {...common}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
                Check: <svg {...common}><polyline points="20 6 9 17 4 12"/></svg>,
                X: <svg {...common}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
                FileText: <svg {...common}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>,
                DollarSign: <svg {...common}><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7H14a3.5 3.5 0 0 1 0 7H6"/></svg>
            };
            return icons[name] || icons.List;
        };

        function App() {
            const [tab, setTab] = React.useState('calendar');
            const [status, setStatus] = React.useState('connecting');

            React.useEffect(() => {
                try {
                    const unsub = db.collection('projects').onSnapshot(() => setStatus('connected'), err => setStatus('error: ' + err.message));
                    return () => unsub();
                } catch(e) { setStatus('error: ' + e.message); }
            }, []);

            return <div className="flex flex-col h-full w-full bg-slate-900 text-white safe-pb">
                <div className="h-14 flex items-center justify-between px-4 bg-slate-900 border-b border-slate-800 shrink-0">
                    <div className="flex items-center gap-2"><div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-white">M</div><span className="font-bold text-lg tracking-tight">MinistryOS</span></div>
                    <div className="flex items-center gap-2"><div className={`w-2 h-2 rounded-full ${status==='connected'?'bg-emerald-500':'bg-red-500'} animate-pulse`}></div><div className="text-[10px] bg-slate-800 px-2 py-1 rounded text-slate-400" onClick={()=>status!=='connected' && alert(status)}>V3.5</div></div>
                </div>
                <div className="flex-1 overflow-y-auto bg-slate-950">
                    {tab === 'calendar' && <CalendarView />}
                    {tab === 'meetings' && <SimpleCollectionManager title="Meetings" collection="meetings" color="emerald" />}
                    {tab === 'benson' && <SimpleProjectView category="Benson" color="red" />}
                    {tab === 'prod' && <SimpleProjectView category="Production" color="yellow" />}
                    {tab === 'crossyth' && <SimpleProjectView category="CrossYTH" color="blue" />}
                    {tab === 'crosslink' && <SimpleProjectView category="CrossLink" color="purple" />}
                    {tab === 'admin' && <AdminManager />}
                </div>
                <div className="h-20 bg-slate-900 border-t border-slate-800 flex justify-around pt-3 safe-pb shrink-0 overflow-x-auto no-scrollbar">
                    <NavBtn id="calendar" icon="Calendar" label="Cal" active={tab} set={setTab} />
                    <NavBtn id="meetings" icon="Briefcase" label="Meet" active={tab} set={setTab} />
                    <NavBtn id="benson" icon="MapPin" label="Benson" active={tab} set={setTab} />
                    <NavBtn id="prod" icon="Mic2" label="Prod" active={tab} set={setTab} />
                    <NavBtn id="crossyth" icon="Users" label="YTH" active={tab} set={setTab} />
                    <NavBtn id="crosslink" icon="BookOpen" label="Link" active={tab} set={setTab} />
                    <NavBtn id="admin" icon="Shield" label="Admin" active={tab} set={setTab} />
                </div>
            </div>;
        }

        function CameraReceiptButton() {
            const fileInputRef = React.useRef(null);
            const [uploading, setUploading] = React.useState(false);
            const handleFile = async (event) => {
                const file = event.target.files && event.target.files[0];
                if (!file) return;
                setUploading(true);
                try {
                    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
                    const receiptId = `cam_${Date.now()}`;
                    const ref = storage.ref().child(`receipts/${new Date().getFullYear()}/${receiptId}_${safeName}`);
                    await ref.put(file);
                    const imageUrl = await ref.getDownloadURL();
                    const res = await fetch(N8N.cameraReceiptIntake, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ receipt_id: receiptId, image_url: imageUrl, submitted_by: 'Pastor Casey' }) });
                    if (!res.ok) throw new Error('Receipt intake failed');
                    alert('Receipt queued for review.');
                } catch (err) { console.error(err); alert('Receipt upload failed: ' + err.message); }
                finally { setUploading(false); event.target.value = ''; }
            };
            return <div className="flex justify-center my-6"><input ref={fileInputRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={handleFile}/><button type="button" aria-label="Capture receipt" title="Capture receipt" disabled={uploading} onClick={() => fileInputRef.current && fileInputRef.current.click()} className={`w-20 h-20 rounded-full flex items-center justify-center shadow-lg border ${uploading ? 'bg-slate-700 border-slate-600 text-slate-400' : 'bg-blue-600 border-blue-400 text-white hover:bg-blue-500'}`}><Icon name="Camera" size={34}/></button></div>;
        }

        function CalendarView() {
            const [date, setDate] = React.useState(new Date());
            const [events, setEvents] = React.useState([]);
            React.useEffect(() => {
                const unsub = db.collection('projects').onSnapshot(snap => {
                    const items = snap.docs.map(d => ({id: d.id, ...d.data(), type:'Project'}));
                    db.collection('meetings').get().then(mSnap => setEvents([...items, ...mSnap.docs.map(d => ({id:d.id, ...d.data(), type:'Meeting', category:'Meeting'}))]));
                });
                return () => unsub();
            }, []);
            const daysInMonth = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
            const firstDay = new Date(date.getFullYear(), date.getMonth(), 1).getDay();
            const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            const getColor = cat => cat === 'Meeting' ? 'bg-emerald-500' : cat === 'Benson' ? 'bg-red-500' : cat === 'Production' ? 'bg-yellow-500' : cat === 'CrossYTH' ? 'bg-blue-500' : 'bg-purple-500';
            const getEventsForDay = d => { const dateStr = new Date(date.getFullYear(), date.getMonth(), d).toISOString().split('T')[0]; return events.filter(e => e.dueDate === dateStr || e.date === dateStr); };
            const upcomingEvents = events.filter(e => e.dueDate || e.date).filter(e => new Date(e.dueDate || e.date) >= new Date(new Date().setHours(0,0,0,0))).sort((a,b) => (a.dueDate||a.date).localeCompare(b.dueDate||b.date));
            return <div className="p-4 pb-24"><div className="flex justify-between items-center mb-4"><button onClick={()=>setDate(new Date(date.getFullYear(), date.getMonth()-1, 1))}><Icon name="ChevronLeft"/></button><h2 className="text-xl font-bold">{monthNames[date.getMonth()]} {date.getFullYear()}</h2><button onClick={()=>setDate(new Date(date.getFullYear(), date.getMonth()+1, 1))}><Icon name="ChevronRight"/></button></div><CameraReceiptButton/><div className="cal-grid mb-8">{['S','M','T','W','T','F','S'].map((d, i)=><div key={i} className="text-center text-[10px] text-slate-500 py-1">{d}</div>)}{Array(firstDay).fill(null).map((_,i)=><div key={'e'+i}/>)}{Array(daysInMonth).fill(null).map((_,i)=>{ const dayEvs = getEventsForDay(i+1); const isToday = new Date().toDateString() === new Date(date.getFullYear(), date.getMonth(), i+1).toDateString(); return <div key={i} className={`cal-day ${dayEvs.length ? 'bg-slate-800' : 'bg-slate-900'} ${isToday?'current-day':''}`}><span className={isToday?'text-blue-400 font-bold':'text-slate-400'}>{i+1}</span><div className="flex flex-wrap justify-center gap-1 mt-1">{dayEvs.map((e,x)=><div key={x} className={`dot ${getColor(e.category)}`}/>)}</div></div>; })}</div><div className="space-y-4"><div className="flex items-center gap-2 mb-2"><Icon name="List" size={16} className="text-slate-500"/><h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest">Master Agenda</h3></div>{upcomingEvents.length === 0 && <div className="text-center text-slate-600 italic py-4">No upcoming events found.</div>}{upcomingEvents.map((e, i) => <div key={i} className="flex gap-4 items-start bg-slate-900/50 p-3 rounded-xl border border-slate-800"><div className="flex flex-col items-center min-w-[50px] bg-slate-800 rounded p-2"><span className="text-[10px] text-slate-400 uppercase font-bold">{new Date(e.dueDate||e.date).toLocaleString('default', {month:'short'})}</span><span className="text-xl font-bold text-white">{new Date(e.dueDate||e.date).getDate()}</span></div><div className="flex-1"><div className="flex justify-between items-start"><h4 className="font-bold text-sm text-white">{e.title}</h4><span className={`text-[10px] px-2 py-0.5 rounded-full text-white font-bold ${getColor(e.category)}`}>{e.category}</span></div><p className="text-xs text-slate-400 mt-1 line-clamp-1">{e.desc || e.notes || 'No details'}</p></div></div>)}</div></div>;
        }

        function SimpleProjectView({category, color}) {
            const [items, setItems] = React.useState([]);
            React.useEffect(() => { const unsub = db.collection('projects').where('category','==',category).onSnapshot(snap => setItems(snap.docs.map(d=>({id:d.id, ...d.data()})))); return () => unsub(); }, [category]);
            return <div className="p-4 pb-24"><h2 className="text-2xl font-bold mb-4">{category}</h2><div className="space-y-3">{items.map(item => <div key={item.id} className="bg-slate-900 border border-slate-800 rounded-xl p-4"><div className="flex justify-between"><div><div className="font-bold">{item.title}</div><div className="text-xs text-slate-500">{item.subCategory || 'Project'} • {item.status || 'Pending'}</div></div><span className={`text-${color}-400 text-xs font-bold`}>{item.dueDate || item.date || ''}</span></div><p className="text-xs text-slate-400 mt-2">{item.desc || item.notes || 'No details'}</p></div>)}</div>{items.length === 0 && <div className="text-slate-600 italic text-center py-10">No records found.</div>}</div>;
        }

        function SimpleCollectionManager({title, collection, color}) {
            const [items, setItems] = React.useState([]);
            React.useEffect(() => { const unsub = db.collection(collection).onSnapshot(snap => setItems(snap.docs.map(d=>({id:d.id, ...d.data()})))); return () => unsub(); }, [collection]);
            return <div className="p-4 pb-24"><h2 className="text-2xl font-bold mb-4">{title}</h2><div className="space-y-3">{items.map(item => <div key={item.id} className="bg-slate-900 border border-slate-800 rounded-xl p-4"><div className="font-bold">{item.title}</div><div className="text-xs text-slate-500 mt-1">{item.date || item.dueDate || ''}</div><p className="text-xs text-slate-400 mt-2">{item.notes || item.desc || item.attendees || 'No details'}</p></div>)}</div>{items.length === 0 && <div className="text-slate-600 italic text-center py-10">No records found.</div>}</div>;
        }

        function AdminManager() {
            const [sub, setSub] = React.useState('Receipts');
            return <div className="p-4 h-full flex flex-col"><SubNav tabs={['Receipts','Budget','DCLA','Settings']} active={sub} set={setSub}/>{sub==='Receipts' && <ReceiptQueue/>}{sub==='Budget' && <AdminPlaceholder icon="DollarSign" title="Budget" text="Budget tracking will connect to approved receipt records and billing codes."/>}{sub==='DCLA' && <AdminPlaceholder icon="Shield" title="DCLA" text="DCLA leadership tracking will live here: apprentices, leaders, coaches, directors, and discipleship status."/>}{sub==='Settings' && <AdminPlaceholder icon="List" title="Settings / Billing Codes" text="Billing code management and MinistryOS admin settings will live here."/>}</div>;
        }
        function SubNav({tabs, active, set}) { return <div className="flex bg-slate-900 p-1 rounded-xl mb-4 shrink-0 overflow-x-auto no-scrollbar">{tabs.map(t => <button key={t} onClick={()=>set(t)} className={`flex-1 py-2 px-3 whitespace-nowrap text-xs font-bold rounded-lg ${active===t?'bg-slate-700 text-white':'text-slate-500'}`}>{t}</button>)}</div>; }
        function AdminPlaceholder({icon, title, text}) { return <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 text-center"><div className="w-14 h-14 rounded-full bg-slate-800 flex items-center justify-center mx-auto mb-4 text-blue-400"><Icon name={icon} size={28}/></div><h2 className="text-xl font-bold mb-2">{title}</h2><p className="text-sm text-slate-400">{text}</p></div>; }
        function ReceiptQueue() {
            const [receipts, setReceipts] = React.useState([]);
            const [loading, setLoading] = React.useState(false);
            const [error, setError] = React.useState('');
            const load = async () => { setLoading(true); setError(''); try { const res = await fetch(N8N.adminReceiptQueue, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({limit: 50}) }); if(!res.ok) throw new Error('Queue request failed'); const data = await res.json(); setReceipts(data.receipts || []); } catch(err) { console.error(err); setError(err.message); } finally { setLoading(false); } };
            React.useEffect(() => { load(); }, []);
            return <div className="flex-1 overflow-y-auto pb-24"><div className="flex justify-between items-center mb-4"><div><h2 className="text-2xl font-bold">Receipts</h2><p className="text-xs text-slate-500">Pending Review</p></div><button onClick={load} className="bg-slate-800 px-3 py-2 rounded text-xs font-bold text-blue-400">Refresh</button></div>{loading && <div className="text-slate-500 text-sm">Loading receipt queue...</div>}{error && <div className="bg-red-900/30 border border-red-900 text-red-300 rounded-xl p-3 text-sm mb-3">{error}</div>}{!loading && receipts.length===0 && <div className="text-center text-slate-600 italic py-8">No pending receipts found.</div>}<div className="space-y-3">{receipts.map((r,i) => <div key={r.receiptId || i} className="bg-slate-900 border border-slate-800 rounded-xl p-4"><div className="flex justify-between gap-3"><div><div className="font-bold">{r.vendor}</div><div className="text-xs text-slate-500">{r.foundAt || 'No date'} • {r.source}</div></div><div className="text-right"><div className="font-bold text-emerald-400">${Number(r.total || 0).toFixed(2)}</div><div className="text-[10px] text-yellow-400">{r.approvalStatus}</div></div></div>{r.summary && <p className="text-xs text-slate-400 mt-3">{r.summary}</p>}<div className="flex justify-between items-center mt-3"><span className={`text-[10px] px-2 py-1 rounded ${r.hasPdf?'bg-emerald-900/30 text-emerald-400':'bg-slate-800 text-slate-500'}`}>{r.hasPdf ? 'Image/PDF Ready' : 'Needs Evidence'}</span>{r.reviewLink && <a href={r.reviewLink} target="_blank" className="text-xs text-blue-400 font-bold">Open</a>}</div></div>)}</div></div>;
        }
        const NavBtn = ({id, icon, label, active, set}) => <button onClick={()=>set(id)} className={`tab-btn ${active===id?'tab-active':''}`}><Icon name={icon} size={24}/><span className="text-[10px] font-bold">{label}</span></button>;
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
