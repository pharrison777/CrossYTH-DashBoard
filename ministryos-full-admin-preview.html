function CameraReceiptButton(){const inputRef=React.useRef(null);const[busy,setBusy]=React.useState(false);const handleFile=async(e)=>{const file=e.target.files&&e.target.files[0];if(!file)return;setBusy(true);try{const id='cam_'+Date.now();const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const ref=storage.ref().child(`receipts/${new Date().getFullYear()}/${id}_${safe}`);await ref.put(file);const image_url=await ref.getDownloadURL();const res=await fetch(N8N.cameraReceiptIntake,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({receipt_id:id,image_url,submitted_by:'Pastor Casey'})});if(!res.ok)throw new Error('receipt intake failed');alert('Receipt queued for review.')}catch(err){alert('Receipt upload failed: '+err.message)}finally{setBusy(false);e.target.value=''}};return <div className="flex justify-center my-6"><input ref={inputRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={handleFile}/><button aria-label="Capture receipt" title="Capture receipt" disabled={busy} onClick={()=>inputRef.current.click()} className={(busy?'bg-slate-700 border-slate-600':'bg-blue-600 border-blue-400 hover:bg-blue-500')+' w-20 h-20 rounded-full flex items-center justify-center shadow-lg border text-white'}><Icon name="Camera" size={34}/></button></div>}

function MeetingsManager(){const[meetings,setMeetings]=React.useState([]);const[isAdding,setIsAdding]=React.useState(false);const[active,setActive]=React.useState(null);const[form,setForm]=React.useState({title:'',date:'',attendees:'',docLink:''});const[notes,setNotes]=React.useState('');const[edit,setEdit]=React.useState(false);React.useEffect(()=>{const u=db.collection('meetings').orderBy('date','desc').onSnapshot(s=>setMeetings(s.docs.map(d=>({id:d.id,...d.data()}))));return()=>u()},[]);const save=async()=>{await db.collection('meetings').add({...form,notes:'',tasks:[]});setIsAdding(false);setForm({title:'',date:'',attendees:'',docLink:''})};const update=async()=>{await db.collection('meetings').doc(active.id).update(active);setEdit(false)};const del=async()=>{if(confirm('Delete meeting?')){await db.collection('meetings').doc(active.id).delete();setActive(null)}};const updateNotes=async()=>{await db.collection('meetings').doc(active.id).update({notes});alert('Notes saved')};if(active)return <div className="p-4 pb-24"><button onClick={()=>setActive(null)} className="text-slate-400 mb-4">Back</button><div className="bg-slate-900 p-4 rounded-xl border border-slate-800 mb-4">{edit?<div className="space-y-3"><input value={active.title} onChange={e=>setActive({...active,title:e.target.value})}/><input type="date" value={active.date} onChange={e=>setActive({...active,date:e.target.value})}/><input value={active.attendees} onChange={e=>setActive({...active,attendees:e.target.value})}/><input value={active.docLink||''} onChange={e=>setActive({...active,docLink:e.target.value})}/><button onClick={update} className="bg-blue-600 w-full py-2 rounded font-bold">Save</button></div>:<div><div className="flex justify-between"><h2 className="text-xl font-bold">{active.title}</h2><div><button onClick={()=>setEdit(true)} className="card-action"><Icon name="Edit"/></button><button onClick={del} className="card-action text-red-400"><Icon name="Trash"/></button></div></div><p className function WorkflowSystem({category,sub,color}){const[mode,setMode]=React.useState('Ideas'),[items,setItems]=React.useState([]),[isAdding,setIsAdding]=React.useState(false),[form,setForm]=React.useState({title:'',desc:'',date:''}),[expanded,setExpanded]=React.useState(null),[editingId,setEditingId]=React.useState(null);React.useEffect(()=>{const q=db.collection('projects').where('category','==',category).where('subCategory','==',sub).where('status','==',mode==='Ideas'?'Pending':'Approved');const u=q.onSnapshot(s=>setItems(s.docs.map(d=>({id:d.id,...d.data()}))));return()=>u()},[category,sub,mode]);const generate=(title,desc,date)=>[{txt:'Concept & Budget',date,done:false},{txt:'Team Recruit',date,done:false},{txt:'TARGET COMPLETION',date,done:false,isTarget:true}];const save=async()=>{if(!form.title||!form.date)return alert('Required');await db.collection('projects').add({category,subCategory:sub,title:form.title,desc:form.desc,dueDate:form.date,status:'Pending',tasks:[]});setIsAdding(false);setForm({title:'',desc:'',date:''})};const update=async()=>{await db.collection('projects').doc(editingId).update({title:form.title,desc:form.desc,dueDate:form.date});setEditingId(null);setIsAdding(false)};const del=async id=>{if(confirm('Delete this?'))await db.collection('projects').doc(id).delete()};const approve=async item=>await db.collection('projects').doc(item.id).update({status:'Approved',tasks:generate(item.title,item.desc,item.dueDate)});const startEdit=item=>{setForm({title:item.title,desc:item.desc,date:item.dueDate});setEditingId(item.id);setIsAdding(true)};return <div className="flex-1 overflow-y-auto pb-24"><div className="flex justify-between mb-4"><div className="flex gap-4"><button onClick={()=>setMode('Ideas')} className={(mode==='Ideas'?'text-white underline':'text-slate-500')+' text-sm font-bold'}>IDEAS</button><button onClick={()=>setMode('Active')} className={(mode==='Active'?'text-white underline':'text-slate-500')+' text-sm font-bold'}>ACTIVE</button></div>{mode==='Ideas'&&<button onClick={()=>{setEditingId(null);setForm({title:'',desc:'',date:''});setIsAdding(true)}} className="text-blue-500"><Icon name="PlusCircle"/></button>}</div>{isAdding&&<div className="bg-slate-800 p-4 rounded-xl mb-4 space-y-3"><input placeholder="Title" value={form.title} onChange={e=>setForm({...form,title:e.target.value})}/><textarea placeholder="Description" value={form.desc} onChange={e=>setForm({...form,desc:e.target.value})}/><input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/><button onClick={editingId?update:save} className="bg-blue-600 w-full py-3 rounded font-bold">{editingId?'Update':'Save Idea'}</button></div>}<div className="space-y-3">{items.map(item=><div key={item.id} className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden"><div className="p-4" onClick={()=>mode==='Active'&&setExpanded(expanded===item.id?null:item.id)}><div className="flex justify-between"><div><div className="font-bold">{item.title}</div><p className="text-xs text-slate-400">{item.desc}</p><p className="text-[10px] text-slate-500 mt-1">Due: {item.dueDate}</p></div>{mode==='Ideas'?<div className="flex gap-1"><button onClick={e=>{e.stopPropagation();startEdit(item)}} className="card-action"><Icon name="Edit"/></button><button onClick={e=>{e.stopPropagation();del(item.id)}} className="card-action text-red-400"><Icon name="Trash"/></button><button onClick={e=>{e.stopPropagation();approve(item)}} className="bg-emerald-600 px-2 py-1 rounded text-xs">Approve</button></div>:<button onClick={e=>{e.stopPropagation();del(item.id)}} className="text-red-400"><Icon name="Trash"/></button>}</div></div>{expanded===item.id&&<div className="bg-slate-950 p-4 border-t border-slate-800">{(item.tasks||[]).map((t,i)=><div key={i} className="flex gap-2 text-sm mb-2"><Icon name={t.done?'Check':'List'} size={14}/><span>{t.date} — {t.txt}</span></div>)}</div>}</div>)}</div></div>}
function SeriesManager({category,color}){const[series,setSeries]=React.useState([]),[add,setAdd]=React.useState(false),[form,setForm]=React.useState({title:'',weeks:''}),[expanded,setExpanded]=React.useState(null);React.useEffect(()=>{const u=db.collection('series').where('category','==',category).onSnapshot(s=>setSeries(s.docs.map(d=>({id:d.id,...d.data()}))));return()=>u()},[category]);const save=async()=>{await db.collection('series').add({category,title:form.title,weeks:form.weeks});setAdd(false);setForm({title:'',weeks:''})};return <div className="flex-1 overflow-y-auto pb-24"><div className="flex justify-between mb-4"><h3 className="text-xs font-bold text-slate-500 uppercase">Sermon Series</h3><button onClick={()=>setAdd(true)}><Icon name="PlusCircle"/></button></div>{add&&<div className="bg-slate-800 p-4 rounded-xl mb-4 space-y-3"><input placeholder="Series Title" value={form.title} onChange={e=>setForm({...form,title:e.target.value})}/><input placeholder="Weeks" value={form.weeks} onChange={e=>setForm({...form,weeks:e.target.value})}/><button onClick={save} className="bg-blue-600 w-full py-2 rounded">Save Series</button></div>}{series.map(s=><div key={s.id} className="bg-slate-900 border border-slate-800 rounded-xl mb-3"><div onClick={()=>setExpanded(expanded===s.id?null:s.id)} className="p-4 flex justify-between"><div><b>{s.title}</b><p className="text-xs text-slate-500">{s.weeks} Weeks</p></div><Icon name="List"/></div>{expanded===s.id&&<SermonList seriesId={s.id}/>}</div>)}</div>}
function SermonList({seriesId}){const[sermons,setSermons]=React.useState([]),[form,setForm]=React.useState({title:'',speaker:'',scripture:'',notes:''}),[add,setAdd]=React.useState(false),[edit,setEdit]=React.useState(null);React.useEffect(()=>{const u=db.collection('sermons').where('seriesId','==',seriesId).onSnapshot(s=>setSermons(s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.weekNum||0)-(b.weekNum||0))));return()=>u()},[seriesId]);const save=async()=>{edit?await db.collection('sermons').doc(edit).update(form):await db.collection('sermons').add({...form,seriesId,weekNum:sermons.length+1});setAdd(false);setEdit(null);setForm({title:'',speaker:'',scripture:'',notes:''})};return <div className="bg-slate-950 p-4 border-t border-slate-800">{sermons.map(s=><div key={s.id} className="border-b border-slate-800 pb-3 mb-3"><div className="flex justify-between"><span className="text-xs text-blue-400">Week {s.weekNum}</span><button onClick={()=>{setEdit(s.id);setAdd(true);setForm({title:s.title,speaker:s.speaker,scripture:s.scripture,notes:s.notes})}}><Icon name="Edit" size={14}/></button></div><b>{s.title}</b><p className="text-xs italic text-slate-400">{s.scripture}</p><p className="text-xs bg-slate-900 p-2 rounded mt-2">{s.notes}</p></div>)}{add&&<div className="space-y-2"><input placeholder="Title" value={form.title} onChange={e=>setForm({...form,title:e.target.value})}/><input placeholder="Speaker" value={form.speaker} onChange={e=>setForm({...form,speaker:e.target.value})}/><input placeholder="Scripture" value={form.scripture} onChange={e=>setForm({...form,scripture:e.target.value})}/><textarea placeholder="Notes" value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})}/><button onClick={save} className="bg-blue-600 w-full py-2 rounded">Save Sermon</button></div>}<button onClick={()=>setAdd(true)} className="w-full py-2 border border-dashed border-slate-700 text-xs rounded text-slate-500">+ Add Week {sermons.length+1}</button></div>}
function WeeklyChecklist(){const[tasks,setTasks]=React.useState([]),[isAdding,setIsAdding]=React.useState(false),[mainTitle,setMainTitle]=React.useState('');React.useEffect(()=>{const u=db.collection('prod_weekly').onSnapshot(s=>setTasks(s.docs.map(d=>({id:d.id,...d.data()}))));return()=>u()},[]);const addMain=async()=>{await db.collection('prod_weekly').add({title:mainTitle,subtasks:[]});setMainTitle('');setIsAdding(false)};const addSub=async(id,current)=>{const txt=prompt('Subtask:');if(txt)await db.collection('prod_weekly').doc(id).update({subtasks:[...(current||[]),{txt,done:false}]})};return <div className="flex-1 overflow-y-auto pb-24"><div className="flex justify-between mb-4"><h3 className="text-xs font-bold text-yellow-500 uppercase">Weekly Checklist</h3><button onClick={()=>setIsAdding(true)}><Icon name="PlusCircle"/></button></div>{isAdding&&<div className="flex gap-2 mb-4"><input value={mainTitle} onChange={e=>setMainTitle(e.target.value)} placeholder="Task Name"/><button onClick={addMain} className="bg-yellow-600 px-4 rounded">Add</button></div>}{tasks.map(t=><div key={t.id} className="bg-slate-900 border border-slate-800 rounded-xl p-4 mb-3"><div className="flex justify-between"><b>{t.title}</b><button onClick={()=>addSub(t.id,t.subtasks)} className="text-xs text-blue-400">+ SUB</button></div>{(t.subtasks||[]).map((s,i)=><div key={i} className="text-sm text-slate-300 mt-2">• {s.txt}</div>)}</div>)}</div>}
function AdminManager(){const[sub,setSub]=React.useState('Receipts');return <div className="p-4 h-full flex flex-col"><SubNav tabs={['Receipts','Budget','DCLA','Settings']} active={sub} set={setSub}/>{sub==='Receipts'?<ReceiptQueue/>:<AdminCard title={sub}/>}</div>}
function ReceiptQueue(){const[rows,setRows]=React.useState([]),[loading,setLoading]=React.useState(false),[selected,setSelected]=React.useState(null),[billing,setBilling]=React.useState('');const isReal=r=>{const text=((r.emailSubject||'')+' '+(r.summary||'')+' '+(r.vendor||'')).toLowerCase();if((r.source||'').toLowerCase().includes('ministryos camera'))return true;if(/free shipping|last chance|sale|newsletter|meeting|attendance report|deposit report|clt meeting/.test(text))return false;return /receipt|invoice|order|purchase|payment|transaction|burger king|apple/.test(text)};const load=async()=>{setLoading(true);try{const res=await fetch(N8N.adminReceiptQueue,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({limit:100,pdf_only:false})});const data=await res.json();setRows((data.receipts||[]).filter(isReal))}catch(e){alert(e.message)}finally{setLoading(false)}};React.useEffect(()=>{load()},[]);const open=r=>{setSelected(r);setBilling(r.billingCode||'')};return <div className="flex-1 overflow-y-auto pb-24"><div className="flex justify-between mb-4"><div><h2 className="text-2xl font-bold">Receipts</h2><p className="text-xs text-slate-500">Filtered Pending Review</p></div><button onClick={load} className="bg-slate-800 px-3 py-2 rounded text-xs text-blue-400">Refresh</button></div>{loading&&<p className="text-slate-500">Loading...</p>}{rows.map((r,i)=><div key={r.receiptId||i} onClick={()=>open(r)} className="bg-slate-900 border border-slate-800 rounded-xl p-4 mb-3"><div className="flex justify-between"><div><b>{r.vendor}</b><p className="text-xs text-slate-500">{r.foundAt||'No date'} • {r.source}</p></div><b className="text-emerald-400">${Number(r.total||0).toFixed(2)}</b></div><p className="text-xs text-slate-400 mt-2">{r.summary}</p></div>)}{selected&&<div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4"><div className="bg-slate-900 border border-slate-700 rounded-xl p-4 w-full max-w-md space-y-3"><div className="flex justify-between"><h2 className="font-bold">Receipt Review</h2><button onClick={()=>setSelected(null)}><Icon name="X"/></button></div><p className="text-sm"><b>{selected.vendor}</b> — ${Number(selected.total||0).toFixed(2)}</p><p className="text-xs text-slate-400">{selected.summary}</p><input placeholder="Billing Code" value={billing} onChange={e=>setBilling(e.target.value)}/><button onClick={()=>alert('Billing code save endpoint is next: '+billing)} className="bg-blue-600 w-full py-3 rounded font-bold">Save Billing Code</button>{selected.reviewLink&&<a target="_blank" href={selected.reviewLink} className="text-blue-400 text-sm">Open Evidence</a>}</div></div>}</div>}
function AdminCard({title}){return <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 text-center"><div className="w-14 h-14 rounded-full bg-slate-800 flex items-center justify-center mx-auto mb-4 text-blue-400"><Icon name={title==='Budget'?'DollarSign':'Shield'} size={28}/></div><h2 className="text-xl font-bold mb-2">{title}</h2><p className="text-sm text-slate-400">{title} management lives under Admin.</p></div>}
const NavBtn=({id,icon,label,active,set})=><button onClick={()=>set(id)} className={(active===id?'tab-active ':'')+'tab-btn'}><Icon name={icon} size={24}/><span className="text-[10px] font-bold">{label}</span></button>;
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
