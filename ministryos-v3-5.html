<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>MinistryOS 3.5 Preview</title>
  <meta name="theme-color" content="#0f172a" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
  <style>
    body { background:#0f172a; color:white; -webkit-tap-highlight-color:transparent; }
    .safe-pb { padding-bottom: env(safe-area-inset-bottom); }
    .tab-btn { display:flex; flex-direction:column; align-items:center; gap:4px; color:#64748b; min-width:42px; transition:.2s; }
    .tab-active { color:#3b82f6; transform:scale(1.08); }
    .no-scrollbar::-webkit-scrollbar { display:none; }
    .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
    .cal-day { min-height:45px; border-radius:6px; font-size:11px; padding:4px; display:flex; flex-direction:column; align-items:center; }
    input, textarea, select { background:#1e293b; border:1px solid #334155; color:white; border-radius:8px; padding:12px; width:100%; outline:none; font-size:16px; }
  </style>
</head>
<body>
  <div id="root" class="h-screen w-screen bg-slate-900"></div>
  <script type="text/babel">
    const firebaseConfig = {
      apiKey: "AIzaSyCWTjZ5P-cvfL3bgFOrl53qRQEfWP35ThE",
      authDomain: "crossyth-dashboard.firebaseapp.com",
      projectId: "crossyth-dashboard",
      storageBucket: "crossyth-dashboard.firebasestorage.app",
      messagingSenderId: "999386499044",
      appId: "1:999386499044:web:49e4bc10c133b4c20f29f1"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();
    const N8N = {
      cameraReceiptIntake: 'https://snl513.app.n8n.cloud/webhook/ministryos-camera-receipt-intake-v1',
      adminReceiptQueue: 'https://snl513.app.n8n.cloud/webhook/ministryos-admin-receipt-queue-v1'
    };
    const Icon = ({name, size=24}) => {
      const common = {xmlns:'http://www.w3.org/2000/svg', width:size, height:size, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', strokeWidth:2, strokeLinecap:'round', strokeLinejoin:'round'};
      const icons = {
        Camera:<svg {...common}><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>,
        Calendar:<svg {...common}><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
        Briefcase:<svg {...common}><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>,
        MapPin:<svg {...common}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>,
        Mic2:<svg {...common}><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>,
        Users:<svg {...common}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>,
        BookOpen:<svg {...common}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
        Shield:<svg {...common}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
        Dollar:<svg {...common}><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7H14a3.5 3.5 0 0 1 0 7H6"/></svg>,
        List:<svg {...common}><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/></svg>
      };
      return icons[name] || icons.List;
    };
    function CameraButton(){
      const inputRef = React.useRef(null); const [busy,setBusy] = React.useState(false);
      const onFile = async e => {
        const file = e.target.files && e.target.files[0]; if(!file) return; setBusy(true);
        try {
          const id = 'cam_' + Date.now();
          const ref = storage.ref().child('receipts/' + new Date().getFullYear() + '/' + id + '_' + file.name.replace(/[^a-zA-Z0-9._-]/g,'_'));
          await ref.put(file); const image_url = await ref.getDownloadURL();
          const res = await fetch(N8N.cameraReceiptIntake,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({receipt_id:id,image_url,submitted_by:'Pastor Casey'})});
          if(!res.ok) throw new Error('n8n intake failed'); alert('Receipt queued for review.');
        } catch(err){ alert('Receipt upload failed: ' + err.message); }
        finally { setBusy(false); e.target.value=''; }
      };
      return <div className="flex justify-center my-8"><input ref={inputRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={onFile}/><button aria-label="Capture receipt" title="Capture receipt" disabled={busy} onClick={()=>inputRef.current.click()} className={(busy?'bg-slate-700 border-slate-500':'bg-blue-600 border-blue-300 hover:bg-blue-500') + ' w-20 h-20 rounded-full flex items-center justify-center shadow-lg border text-white'}><Icon name="Camera" size={34}/></button></div>;
    }
    function App(){ const [tab,setTab] = React.useState('calendar'); const [connected,setConnected] = React.useState(false); React.useEffect(()=>{const u=db.collection('projects').onSnapshot(()=>setConnected(true),()=>setConnected(false)); return()=>u();},[]); return <div className="flex flex-col h-full w-full bg-slate-900 text-white safe-pb"><header className="h-14 flex items-center justify-between px-4 bg-slate-900 border-b border-slate-800"><div className="flex items-center gap-2"><div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-bold">M</div><b>MinistryOS</b></div><div className="flex items-center gap-2"><div className={(connected?'bg-emerald-500':'bg-red-500') + ' w-2 h-2 rounded-full animate-pulse'}></div><span className="text-[10px] bg-slate-800 px-2 py-1 rounded text-slate-400">V3.5</span></div></header><main className="flex-1 overflow-y-auto bg-slate-950">{tab==='calendar'&&<Calendar/>}{tab==='admin'&&<Admin/>}{!['calendar','admin'].includes(tab)&&<Simple title={tab}/>}</main><nav className="h-20 bg-slate-900 border-t border-slate-800 flex justify-around pt-3 overflow-x-auto no-scrollbar"><Nav id="calendar" icon="Calendar" label="Cal" tab={tab} setTab={setTab}/><Nav id="meetings" icon="Briefcase" label="Meet" tab={tab} setTab={setTab}/><Nav id="benson" icon="MapPin" label="Benson" tab={tab} setTab={setTab}/><Nav id="prod" icon="Mic2" label="Prod" tab={tab} setTab={setTab}/><Nav id="crossyth" icon="Users" label="YTH" tab={tab} setTab={setTab}/><Nav id="crosslink" icon="BookOpen" label="Link" tab={tab} setTab={setTab}/><Nav id="admin" icon="Shield" label="Admin" tab={tab} setTab={setTab}/></nav></div> }
    function Calendar(){ return <section className="p-4 pb-24"><h1 className="text-2xl font-bold">Calendar</h1><CameraButton/><div className="bg-slate-900 border border-slate-800 rounded-xl p-4 text-sm text-slate-400">Calendar view stays here. Event editing and cross-calendar sync will be added after receipt/admin wiring.</div></section> }
    function Admin(){ const [sub,setSub]=React.useState('Receipts'); return <section className="p-4 pb-24"><div className="flex bg-slate-900 p-1 rounded-xl mb-4 overflow-x-auto"><Sub label="Receipts" sub={sub} setSub={setSub}/><Sub label="Budget" sub={sub} setSub={setSub}/><Sub label="DCLA" sub={sub} setSub={setSub}/><Sub label="Settings" sub={sub} setSub={setSub}/></div>{sub==='Receipts'?<ReceiptQueue/>:<AdminCard title={sub}/>}</section> }
    function ReceiptQueue(){ const [rows,setRows]=React.useState([]); const [loading,setLoading]=React.useState(false); const load=async()=>{setLoading(true); try{const res=await fetch(N8N.adminReceiptQueue,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({limit:50})}); const data=await res.json(); setRows(data.receipts||[]);}catch(e){alert(e.message)} finally{setLoading(false)}}; React.useEffect(()=>{load()},[]); return <div><div className="flex justify-between items-center mb-4"><div><h1 className="text-2xl font-bold">Receipts</h1><p className="text-xs text-slate-500">Pending Review</p></div><button onClick={load} className="bg-slate-800 text-blue-400 px-3 py-2 rounded text-xs font-bold">Refresh</button></div>{loading&&<p className="text-slate-500">Loading...</p>}{rows.length===0&&!loading&&<p className="text-slate-600 italic text-center py-8">No pending receipts found.</p>}<div className="space-y-3">{rows.map((r,i)=><div key={r.receiptId||i} className="bg-slate-900 border border-slate-800 rounded-xl p-4"><div className="flex justify-between"><div><b>{r.vendor}</b><p className="text-xs text-slate-500">{r.foundAt||'No date'} • {r.source}</p></div><div className="text-right"><b className="text-emerald-400">${Number(r.total||0).toFixed(2)}</b><p className="text-[10px] text-yellow-400">{r.approvalStatus}</p></div></div>{r.summary&&<p className="text-xs text-slate-400 mt-3">{r.summary}</p>}{r.reviewLink&&<a className="inline-block mt-3 text-xs text-blue-400 font-bold" target="_blank" href={r.reviewLink}>Open</a>}</div>)}</div></div> }
    function Simple({title}){ return <section className="p-4"><h1 className="text-2xl font-bold capitalize">{title}</h1><p className="text-slate-500 mt-4">This section keeps the existing MinistryOS structure and will be expanded after the Admin/Receipts path is stable.</p></section> }
    function AdminCard({title}){ return <div className="bg-slate-900 border border-slate-800 rounded-xl p-6 text-center"><div className="w-14 h-14 rounded-full bg-slate-800 flex items-center justify-center mx-auto mb-4 text-blue-400"><Icon name={title==='Budget'?'Dollar':'Shield'} size={28}/></div><h2 className="text-xl font-bold mb-2">{title}</h2><p className="text-sm text-slate-400">{title} management will live under Admin.</p></div> }
    function Sub({label,sub,setSub}){ return <button onClick={()=>setSub(label)} className={(sub===label?'bg-slate-700 text-white':'text-slate-500')+' flex-1 py-2 px-3 text-xs font-bold rounded-lg'}>{label}</button> }
    function Nav({id,icon,label,tab,setTab}){ return <button onClick={()=>setTab(id)} className={(tab===id?'tab-active ':'')+'tab-btn'}><Icon name={icon}/><span className="text-[10px] font-bold">{label}</span></button> }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
